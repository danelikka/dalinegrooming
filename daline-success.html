<!doctype html>

<html lang="sk">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ďakujeme | DalineGrooming</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        min-height: 100vh;

        background: #f8f5f0;

        color: #4d392f;

        font-family: "Montserrat", sans-serif;

        display: flex;

        flex-direction: column;
      }

      header {
        padding: 22px 7%;

        background: #fff;

        border-bottom: 1px solid #e8ded4;
      }

      .logo {
        font-family: "Cormorant SC", serif;

        font-size: 25px;

        color: #604737;

        text-decoration: none;
      }

      main {
        flex: 1;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 35px 18px;
      }

      .success-card {
        width: 100%;

        max-width: 480px;

        background: white;

        border: 1px solid #eee5dc;

        border-radius: 22px;

        padding: 45px 30px;

        text-align: center;

        box-shadow: 0 12px 35px rgba(60, 40, 30, 0.06);
      }

      .success-icon {
        width: 72px;

        height: 72px;

        border-radius: 50%;

        background: #eee3d8;

        color: #8e6c55;

        font-size: 35px;

        display: flex;

        align-items: center;

        justify-content: center;

        margin: 0 auto 24px;
      }

      h1 {
        font-family: "Cormorant SC", serif;

        font-size: 43px;

        line-height: 1.1;

        margin: 0 0 18px;
      }

      p {
        font-size: 13px;

        line-height: 1.9;

        color: #827063;
      }

      .highlight {
        background: #f2e9e0;

        padding: 18px;

        border-radius: 12px;

        margin: 25px 0;
      }

      .highlight p {
        margin: 0;

        color: #604737;
      }

      .btn {
        display: block;

        padding: 16px;

        background: #a78670;

        color: white;

        text-decoration: none;

        border-radius: 10px;

        font-size: 13px;

        font-weight: 600;

        margin-top: 25px;
      }

      .btn:hover {
        background: #8e6c55;
      }

      .small {
        font-size: 11px;

        margin-top: 20px;
      }

      @media (max-width: 600px) {
        .success-card {
          padding: 35px 23px;
        }

        h1 {
          font-size: 37px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <a href="index.html" class="logo"> 🐾 DalineGrooming </a>
    </header>

    <main>
      <div class="success-card">
        <div class="success-icon">✓</div>

        <h1>Ďakujeme za registráciu!</h1>

        <p>
          Vašu žiadosť o členstvo v

          <strong>Daline Club</strong>

          sme úspešne prijali.
        </p>

        <div class="highlight">
          <p>
            Vašu vernostnú kartu si môžete vyzdvihnúť pri najbližšej návšteve
            nášho salónu.
          </p>
        </div>

        <p>Tešíme sa na vás a vášho miláčika! 🐾</p>

        <a href="index.html" class="btn"> Späť na hlavnú stránku </a>

        <p class="small">S láskou, DalineGrooming ♡</p>
      </div>
    </main>
  </body>
</html>
